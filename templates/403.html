{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Akses Ditolak</title>
    {% tailwind_css %}
    <link rel="stylesheet" href="{% static 'css/responsive-overrides.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body class="min-h-screen bg-slate-50 font-display text-slate-900 antialiased dark:bg-slate-950 dark:text-white">
    <main class="flex min-h-screen items-center justify-center px-4 py-6 sm:px-6 sm:py-10">
        <section class="w-full max-w-md text-center">
            <div class="relative mb-5 inline-flex items-center justify-center">
                <div class="absolute inset-0 rounded-full bg-amber-500/10 blur-xl"></div>
                <div class="relative z-10 flex h-20 w-20 items-center justify-center rounded-2xl border border-amber-100 bg-amber-50 text-amber-500 shadow-sm dark:border-amber-900/30 dark:bg-amber-950/30 dark:text-amber-400 sm:h-24 sm:w-24">
                    <span class="material-symbols-outlined text-[42px] sm:text-[48px]">gpp_maybe</span>
                </div>
            </div>

            <div class="mb-6 space-y-2 sm:mb-8">
                <h1 class="text-4xl font-black tracking-tight text-slate-800 dark:text-white">403</h1>
                <h2 class="text-lg font-bold text-slate-700 dark:text-slate-200">Akses Ditolak / Terbatas</h2>
                <p class="mx-auto max-w-sm text-xs leading-relaxed text-slate-500 dark:text-slate-400">
                    Akun Anda tidak memiliki hak akses atau peran yang sesuai untuk membuka halaman ini. Hubungi administrator jika akses tersebut seharusnya tersedia.
                </p>
            </div>

            <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-center sm:gap-3">
                <button type="button" onclick="window.history.back()"
                    class="inline-flex h-10 w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-xs font-semibold text-slate-600 shadow-sm transition hover:bg-slate-50 hover:text-slate-800 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white sm:w-auto">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Kembali
                </button>
                <a href="/dashboard/"
                    class="inline-flex h-10 w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 text-xs font-bold text-white shadow-sm transition hover:brightness-110 sm:w-auto">
                    <span class="material-symbols-outlined text-[16px]">grid_view</span>
                    Dashboard
                </a>
            </div>
        </section>
    </main>
</body>
</html>
